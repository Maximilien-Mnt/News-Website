name: ingest
on:
  schedule:
    - cron: "7 * * * *" # hourly at minute 7 (avoids the :00 rush)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no database writes)"
        type: boolean
        default: false
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_CALLS_PER_RUN: ${{ vars.LLM_MAX_CALLS_PER_RUN || '30' }}
          INGEST_WINDOW_HOURS: ${{ vars.INGEST_WINDOW_HOURS || '48' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
